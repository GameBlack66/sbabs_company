<script>
    // 1. Bloquer le clic droit
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 2. Bloquer les raccourcis clavier (F12, Ctrl+U, Ctrl+Shift+I, etc.)
    document.onkeydown = function(e) {
        // F12
        if(e.keyCode === 123) return false;
        // Ctrl+Shift+I (Inspecter)
        if(e.ctrlKey && e.shiftKey && e.keyCode === 73) return false;
        // Ctrl+Shift+J (Console)
        if(e.ctrlKey && e.shiftKey && e.keyCode === 74) return false;
        // Ctrl+Shift+C (Inspecter l'élément)
        if(e.ctrlKey && e.shiftKey && e.keyCode === 67) return false;
        // Ctrl+U (Code source)
        if(e.ctrlKey && e.keyCode === 85) return false;
        // Ctrl+S (Enregistrer sous)
        if(e.ctrlKey && e.keyCode === 83) return false;
    };
</script>
